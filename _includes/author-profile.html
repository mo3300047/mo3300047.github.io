{% include base_path %}
{% assign author = site.author %}
<div itemscope itemtype="https://schema.org/Person">
  <div class="author__avatar">
    <img src="{{ base_path }}/images/{{ author.avatar }}" class="author__avatar" alt="{{ author.name | escape }}">
  </div>
  <div class="author__content">
    <h3 class="author__name">{{ author.name }}</h3>
    <p class="author__bio">{{ author.bio }}</p>
  </div>
  <div class="author__urls-wrapper">
    <button type="button" class="btn btn--inverse">Contact</button>
    <ul class="author__urls social-icons">
      <li><i class="fas fa-fw fa-map-marker-alt" aria-hidden="true"></i> {{ author.location }}</li>
      <li><i class="fas fa-fw fa-building" aria-hidden="true"></i> {{ author.employer }}</li>
      <li><a href="mailto:{{ author.email }}"><i class="fas fa-fw fa-envelope" aria-hidden="true"></i> Email</a></li>
      <li><a href="https://www.linkedin.com/in/{{ author.linkedin }}/"><i class="fab fa-fw fa-linkedin" aria-hidden="true"></i> LinkedIn</a></li>
      <li><a href="https://github.com/{{ author.github }}"><i class="fab fa-fw fa-github" aria-hidden="true"></i> GitHub</a></li>
    </ul>
  </div>
</div>
