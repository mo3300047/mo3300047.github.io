# Personal website. Pages live in _pages; shared templates live in _layouts/_includes.
locale: en-US
title: Liyuan Guo
title_separator: "-"
name: Liyuan Guo
description: "Mike Liyuan Guo — full-stack and mobile engineer, IT Department Manager at Merit Asset Management, HKUST and Johns Hopkins graduate."
url: https://mo3300047.github.io
baseurl: ""
repository: mo3300047/mo3300047.github.io
timezone: Asia/Shanghai
future: false
breadcrumbs: false
read_more: disabled
words_per_minute: 160

author:
  name: Liyuan Guo
  avatar: hkBio.jpg
  bio: "Full-stack & mobile engineer · HKUST MSc · JHU BS"
  location: Shenzhen, China
  employer: Merit Asset Management
  email: lguo21@alumni.jh.edu
  github: mo3300047
  linkedin: liyuan-guo

social:
  type: Person
  name: Mike Liyuan Guo
  links:
    - https://github.com/mo3300047
    - https://www.linkedin.com/in/liyuan-guo/

analytics:
  provider: false
comments:
  provider: false

include:
  - _pages
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - package.json
  - .bundle
  - vendor
  - node_modules
  - tmp
  - .sass-cache
  - .jekyll-cache
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
encoding: utf-8
markdown: kramdown
highlighter: rouge
incremental: false
excerpt_separator: "\n\n"
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  entity_output: as_char
  toc_levels: 1..6

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true

sass:
  sass_dir: _sass
  style: compressed
permalink: /:categories/:title/
plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-redirect-from
whitelist:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-redirect-from
compress_html:
  clippings: all
  ignore:
    envs: development
